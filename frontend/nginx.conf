# Verdict SPA production server (Stage 9).
#
# Routing contract:
#   /api/*  → proxied to the Express API ("api" service on the compose
#             network). Same-origin from the browser's perspective, so no
#             CORS and no client-side base URL are needed. If you serve the
#             SPA from a different origin than the API, skip this block and
#             set VITE_API_BASE_URL at build time instead.
#   /assets/* → hashed, immutable build output; cached forever.
#   everything else → SPA history fallback to index.html, so deep links like
#             /problems/:slug and /submissions/:id survive direct navigation
#             and reload.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /fonts/ {
    # Self-hosted webfonts (ISSUE-007): immutable in practice — filenames
    # change only with a new deploy.
    add_header Cache-Control "public, max-age=31536000";
    try_files $uri =404;
  }

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";

    # Deployment boundary note (Stage 9): the API runs with `trust proxy`
    # OFF (a deliberate ADR-006 security default), so behind this nginx every
    # client shares nginx's address for rate-limit purposes. For a public
    # multi-user deployment, enable `trust proxy` with a pinned hop count in
    # the API *and* keep it behind exactly this one proxy — a backend change
    # that was explicitly out of Stage 9 scope (REQ-02).
  }

  location / {
    # SPA history fallback — never cache index.html itself, so deploys land
    # immediately.
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
